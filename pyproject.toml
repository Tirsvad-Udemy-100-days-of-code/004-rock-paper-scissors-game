[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-paper-scissors-game"
version = "0.1.0"
description = "A beginner-friendly Rock, Paper, Scissors game against the computer."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
rock-paper-scissors = "rock_paper_scissors.infrastructure.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
